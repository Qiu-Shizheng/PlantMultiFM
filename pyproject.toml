[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plantmultifm"
version = "0.1.0"
description = "Single-cell RNA and chromatin inference on plant atlas feature axes"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "scipy>=1.8"]

[project.urls]
Repository = "https://github.com/Qiu-Shizheng/PlantMultiFM"

[project.scripts]
plantmultifm = "plantmultifm.cli:main"

[tool.setuptools]
packages = ["plantmultifm"]

